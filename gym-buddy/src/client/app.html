<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Buddy">
<title>Gym Buddy</title>
<link rel="manifest" href="/gym/manifest.webmanifest">
<link rel="icon" href="/gym/icon.svg">
<link rel="apple-touch-icon" href="/gym/icon.svg">
<link rel="stylesheet" href="/gym/app.css">
<script src="/gym/app.js" defer></script>
</head>
<body>
<header class="top">
  <div>
    <div id="title" class="title">Loading…</div>
    <div id="meta" class="meta"></div>
  </div>
  <div id="clockbox" class="clockbox" hidden>
    <span id="clock" class="clock" role="timer" aria-live="off"></span>
    <button id="pause" type="button" class="pause-btn" aria-pressed="false">Pause</button>
  </div>
</header>
<div class="paused-bar" role="status">Paused. The clock is stopped. Tap Resume or tick a set to continue.</div>
<main id="app"><p class="muted pad">Loading your session…</p></main>
<div id="timer" class="timer" hidden>
  <span id="timer-label"></span>
  <span id="timer-time" class="timer-time"></span>
  <button id="timer-add" type="button">+15s</button>
  <button id="timer-stop" type="button">Stop</button>
</div>
</body>
</html>
