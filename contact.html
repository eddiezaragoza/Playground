<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0176d3">
  <title>Eddie Zaragoza | Connect</title>
  <meta name="description" content="Connect with Eddie Zaragoza on LinkedIn, Instagram, TikTok, Venmo and Cash App.">

  <!-- Link preview when the URL is texted or DM'd -->
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Eddie Zaragoza">
  <meta property="og:description" content="LinkedIn · Instagram · TikTok · Venmo · Cash App">
  <meta property="og:url" content="https://eddiezaragoza.com/contact.html">
  <meta property="og:image" content="https://eddiezaragoza.com/images/profile.png">
  <meta name="twitter:card" content="summary">

  <style>
    :root {
      --bg: #f3f3f3;
      --card: #ffffff;
      --text: #181818;
      --text-light: #555555;
      --border: #dddbda;
      --primary: #0176d3;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #1a1d23;
        --text: #f2f2f2;
        --text-light: #a8adb6;
        --border: #2c3038;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding:
        max(40px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    main { width: 100%; max-width: 440px; }

    .profile { text-align: center; margin-bottom: 28px; }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 14px;
      border: 3px solid var(--card);
      box-shadow: var(--shadow);
    }

    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }

    .tagline { color: var(--text-light); font-size: 0.95rem; margin-top: 2px; }

    .links { list-style: none; display: grid; gap: 12px; }

    .section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-light);
      margin: 24px 4px 10px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      color: var(--text);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .link:hover { transform: translateY(-2px); }
    .link:active { transform: scale(0.98); }
    .link:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

    .icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .icon svg { width: 22px; height: 22px; }

    .linkedin  .icon { background: #0a66c2; }
    .instagram .icon { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285aeb 90%); }
    .tiktok    .icon { background: #000; box-shadow: inset 0 0 0 1px #333; }
    .venmo     .icon { background: #008cff; }
    .cashapp   .icon { background: #00d64f; }

    .text { flex: 1 1 auto; min-width: 0; }
    .name { display: block; font-weight: 600; font-size: 1rem; }
    .handle {
      display: block;
      color: var(--text-light);
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chev { flex: 0 0 auto; color: var(--text-light); font-size: 1.25rem; }

    footer {
      text-align: center;
      color: var(--text-light);
      font-size: 0.8rem;
      margin-top: 32px;
    }
    footer a { color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover, .link:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="profile">
      <img class="avatar" src="images/profile.png" alt="Eddie Zaragoza" width="112" height="112">
      <h1>Eddie Zaragoza</h1>
      <p class="tagline">Let's connect</p>
    </header>

    <p class="section-label">Social</p>
    <ul class="links">
      <li>
        <a class="link linkedin" href="https://www.linkedin.com/in/eddie-zaragoza-895796/" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="9" width="4" height="12" rx="0.5"/><circle cx="5" cy="4.5" r="2.3"/><path d="M10 9h3.8v1.7c.6-1 1.9-2 4-2 3.3 0 4.2 2.1 4.2 5V21h-4v-6.3c0-1.5-.3-2.7-1.8-2.7s-2.2 1.1-2.2 2.7V21h-4z"/></svg>
          </span>
          <span class="text"><span class="name">LinkedIn</span><span class="handle">Eddie Zaragoza</span></span>
          <span class="chev" aria-hidden="true">&rsaquo;</span>
        </a>
      </li>
      <li>
        <a class="link instagram" href="https://www.instagram.com/ermitaeddie/" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="text"><span class="name">Instagram</span><span class="handle">@ermitaeddie</span></span>
          <span class="chev" aria-hidden="true">&rsaquo;</span>
        </a>
      </li>
      <li>
        <a class="link tiktok" href="https://www.tiktok.com/@eddiez63" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.3 6.3 0 1 0 5.4 6.3V8.6a8 8 0 0 0 4.4 1.3V6.5a4.4 4.4 0 0 1-4.4-4.5z"/></svg>
          </span>
          <span class="text"><span class="name">TikTok</span><span class="handle">@eddiez63</span></span>
          <span class="chev" aria-hidden="true">&rsaquo;</span>
        </a>
      </li>
    </ul>

    <p class="section-label">Pay me</p>
    <ul class="links">
      <li>
        <a class="link venmo" href="https://venmo.com/code?user_id=1634792646901760730&amp;created=1795853166" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.5 3c.7 1.2 1 2.4 1 3.9 0 4.9-4.2 11.2-7.6 15.6H5.1L2 4.3l6.8-.6 1.6 13.2c1.6-2.6 3.5-6.6 3.5-9.4 0-1.5-.3-2.5-.7-3.4z"/></svg>
          </span>
          <span class="text"><span class="name">Venmo</span><span class="handle">Eddie Zaragoza</span></span>
          <span class="chev" aria-hidden="true">&rsaquo;</span>
        </a>
      </li>
      <li>
        <a class="link cashapp" href="https://cash.app/$EddieZaragoza" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M16 7.5c-.9-1-2.3-1.6-3.9-1.6-2.2 0-3.7 1.1-3.7 2.8 0 3.9 7.9 2.2 7.9 6.4 0 1.8-1.7 3-4 3-1.8 0-3.4-.7-4.4-1.9"/><path d="M12.3 3.5v2.4M11.8 18.1v2.4"/></svg>
          </span>
          <span class="text"><span class="name">Cash App</span><span class="handle">$EddieZaragoza</span></span>
          <span class="chev" aria-hidden="true">&rsaquo;</span>
        </a>
      </li>
    </ul>

    <footer>
      <a href="/">eddiezaragoza.com</a>
    </footer>
  </main>
</body>
</html>
